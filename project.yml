name: CodexBangs

options:
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES

targets:
  CodexNotchPetCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/CodexNotchPetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.jeezlabs.codexbangs.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  CodexBangs:
    type: application
    platform: macOS
    sources:
      - path: Sources/CodexBangsApp
        excludes:
          - Info.plist
    info:
      path: Sources/CodexBangsApp/Info.plist
      properties:
        CFBundleDisplayName: Codex-bangs
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrefersDisplaySafeAreaCompatibilityMode: false
    dependencies:
      - target: CodexNotchPetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.jeezlabs.CodexBangs
        PRODUCT_NAME: Codex-bangs
        ENABLE_APP_SANDBOX: NO

schemes:
  CodexBangs:
    build:
      targets:
        CodexBangs: all
    run:
      config: Debug
    archive:
      config: Release
