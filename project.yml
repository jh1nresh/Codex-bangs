name: CodexBangs

options:
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES

targets:
  CodexNotchPetCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/CodexNotchPetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.jeezlabs.codexbangs.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  CodexBangs:
    type: application
    platform: macOS
    sources:
      - path: Sources/CodexBangsApp
        excludes:
          - Info.plist
      - path: Resources/BundledSkills
        type: folder
        buildPhase: resources
    info:
      path: Sources/CodexBangsApp/Info.plist
      properties:
        CFBundleDisplayName: Codex-bangs
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSScreenCaptureUsageDescription: Codex-bangs captures the display under your pointer only when you click Guide me, sends it through Codex for guidance, and deletes the temporary image after the response.
        NSPrefersDisplaySafeAreaCompatibilityMode: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.jeezlabs.codexbangs.pet-package
            UTTypeDescription: Codex Pet Package
            UTTypeConformsTo:
              - com.apple.package
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - codexpet
        CFBundleDocumentTypes:
          - CFBundleTypeName: Codex Pet Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - io.jeezlabs.codexbangs.pet-package
    dependencies:
      - target: CodexNotchPetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.jeezlabs.CodexBangs
        PRODUCT_NAME: Codex-bangs
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2

schemes:
  CodexBangs:
    build:
      targets:
        CodexBangs: all
    run:
      config: Debug
    archive:
      config: Release
