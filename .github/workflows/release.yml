name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: codex-bangs-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out the requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release request and credentials
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "error: version must look like 1.2.3" >&2
            exit 1
          }

          tag="v$VERSION"
          tag_target="$(
            git ls-remote --tags origin "refs/tags/$tag" | awk '{ print $1 }'
          )"
          if [[ -n "$tag_target" && "$tag_target" != "$GITHUB_SHA" ]]; then
            echo "error: tag already exists at a different commit: $tag" >&2
            exit 1
          fi

      - name: Run core tests
        shell: bash
        run: swift test

      - name: Build, sign, notarize, and verify DMG
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          scripts/build-release.sh \
            --version "$VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output-dir "$RUNNER_TEMP/release"

      - name: Publish GitHub Release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          dmg="$RUNNER_TEMP/release/Codex-bangs-${VERSION}.dmg"
          [[ -f "$dmg" ]] || {
            echo "error: verified DMG is missing" >&2
            exit 1
          }

          tag_target="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" \
              --jq '.object.sha' 2>/dev/null || true
          )"
          if [[ -z "$tag_target" ]]; then
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$tag" \
              --field sha="$GITHUB_SHA" >/dev/null
            tag_target="$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha'
            )"
          fi
          [[ "$tag_target" == "$GITHUB_SHA" ]] || {
            echo "error: release tag does not point at the workflow commit" >&2
            exit 1
          }

          release_id=""
          publication_complete=0
          cleanup_failed_publication() {
            release_exit_code=$?
            trap - EXIT
            set +e

            if ((release_exit_code != 0)) && [[ -n "$release_id" ]]; then
              captured_state="$(
                gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                  --jq '"\(.tag_name)\t\(.draft)"' 2>/dev/null || true
              )"
              if [[ "$captured_state" == "$tag"$'\t'true ]]; then
                echo "Cleaning up this run's unpublished draft release." >&2
                gh api \
                  --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null || true
              elif [[ -n "$captured_state" ]]; then
                echo "warning: captured release is no longer this run's draft; leaving it untouched" >&2
              fi
            fi

            exit "$release_exit_code"
          }
          trap cleanup_failed_publication EXIT

          release_id="$(
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              --field tag_name="$tag" \
              --field name="Codex-bangs $VERSION" \
              --field target_commitish="$GITHUB_SHA" \
              -F draft=true \
              -F prerelease=false \
              -F generate_release_notes=true \
              --jq '.id'
          )"

          asset_name="Codex-bangs-${VERSION}.dmg"
          gh release upload "$tag" "$dmg#$asset_name" \
            --repo "$GITHUB_REPOSITORY"

          expected_size="$(stat -f '%z' "$dmg")"
          uploaded_size="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq ".[] | select(.name == \"$asset_name\") | .size"
          )"
          [[ "$uploaded_size" == "$expected_size" ]] || {
            echo "error: uploaded DMG size does not match the verified artifact" >&2
            exit 1
          }

          published_state="$(
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false \
              --raw-field make_latest=legacy \
              --jq '.draft'
          )"
          [[ "$published_state" == "false" ]] || {
            echo "error: release remained a draft" >&2
            exit 1
          }
          publication_complete=1
          trap - EXIT
